<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Full Page Screenshot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Screenshot</h1>

  <fieldset>
    <legend>Capture</legend>
    <label>
      <input type="radio" name="scope" id="scope-full" value="full" checked />
      Full page
    </label>
    <label>
      <input type="radio" name="scope" id="scope-viewport" value="viewport" />
      Current viewport
    </label>
  </fieldset>

  <fieldset>
    <legend>Method</legend>
    <label>
      <input type="radio" name="method" id="method-stitch" value="stitch" checked />
      Scroll and stitch
    </label>
    <label>
      <input type="radio" name="method" id="method-cdp" value="cdp" />
      Chrome DevTools Protocol
    </label>
  </fieldset>

  <div class="button-row">
    <button id="copy-btn" type="button">
      Copy
      <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
        <rect x="8" y="2" width="8" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <button id="download-btn" type="button">
      Download
      <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
        <path d="M12 3v12m0 0l-4-4m4 4l4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>

  <p id="status" role="status" aria-live="polite"></p>

  <p id="cdp-hint" class="hint" hidden>
    Chrome will briefly show a "started debugging this browser" banner while
    this runs — that's expected, see the README.
  </p>

  <script src="popup.js"></script>
</body>
</html>
